name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const version = readFileSync("version.txt", "utf8").trim();
          const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
          const config = JSON.parse(readFileSync("release-please-config.json", "utf8"));

          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Invalid SemVer version: ${version}`);
          }
          if (manifest["."] !== version) {
            throw new Error("version.txt and Release Please manifest differ.");
          }
          if (config.packages?.["."]?.["release-type"] !== "simple") {
            throw new Error("Root package must use Release Please simple strategy.");
          }
          EOF

  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while read -r commit; do
            message_file=$(mktemp)
            git log -1 --format=%B "$commit" > "$message_file"
            sh .githooks/commit-msg "$message_file"
            rm "$message_file"
          done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wio_test
          POSTGRES_USER: wio
          POSTGRES_PASSWORD: wio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wio -d wio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: django-insecure-ci-only
      DATABASE_URL: postgresql://wio:wio@localhost:5432/wio_test
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('backend/coverage.xml') != '' }}
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: error
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py check
      - run: uv run python manage.py spectacular --validate --file schema.generated.yml --settings=config.settings.test
      - run: diff -u schema.yml schema.generated.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('frontend/coverage/**') != '' }}
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
          if-no-files-found: error
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: wio-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: wio-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
