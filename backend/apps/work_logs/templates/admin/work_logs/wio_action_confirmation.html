{% extends "admin/base_site.html" %}
{% block content %}
  <form method="post">
    {% csrf_token %}
    {% if error %}<p class="errornote">{{ error }}</p>{% endif %}
    <p>This action changes audited work-in-office history. Give a clear business reason.</p>
    <ul>
      {% for object in objects %}
        <li>
          {{ object }}
          <input type="hidden" name="_selected_action" value="{{ object.pk }}">
        </li>
      {% endfor %}
    </ul>
    <div class="form-row">
      <label class="required" for="id_audit_reason">Audit reason:</label>
      <textarea id="id_audit_reason" name="audit_reason" maxlength="500" required></textarea>
    </div>
    <input type="hidden" name="action" value="{{ action_name }}">
    <input type="hidden" name="select_across" value="0">
    <div class="submit-row">
      <input type="submit" name="apply" value="{{ submit_label }}">
      <a class="button cancel-link" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
{% endblock %}
