[project]
name = "yawn-backend"
version = "0.1.0"
description = "Django REST API for YAWN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<6.2",
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-json-logger>=3.3,<5.0",
    "sentry-sdk[django]>=2.40,<3.0",
    "whitenoise>=6.9,<7.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.1,<8.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider --cov --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
