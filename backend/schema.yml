  /api/v1/work-in-office/:
    get:
      operationId: v1_work_in_office_list
      parameters:
      - in: query
        name: attention
        schema:
          type: boolean
          default: false
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: location_choice
        schema:
          enum:
          - in_office
          - not_in_office
          type: string
          minLength: 1
        description: |-
          * `in_office` - In office
          * `not_in_office` - Not in office
      - in: query
        name: month
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          minLength: 1
      - in: query
        name: review_state
        schema:
          enum:
          - draft
          - pending
          - pending_assignment
          - approved
          - rejected
          - not_required
          - expired_pending
          type: string
          minLength: 1
        description: |-
          * `draft` - Draft
          * `pending` - Pending
          * `pending_assignment` - Pending assignment
          * `approved` - Approved
          * `rejected` - Rejected
          * `not_required` - Not required
          * `expired_pending` - Expired pending
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: work_date
        schema:
          type: string
          format: date
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
