            schema:
              $ref: '#/components/schemas/WorkInOfficeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkInOfficeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkInOfficeCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkInOfficeRecord'
          description: ''
