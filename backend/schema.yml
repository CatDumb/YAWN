        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
