components:
  schemas:
    AccessRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - first_name
      - last_name
    AccessRequestResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AmbiguousCompanyScopeError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ApprovalAssignee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - id
      - name
    ApprovalDecisionRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          description: Required for Reject and Assign actions.
          maxLength: 500
        manager_membership_id:
          type: integer
          minimum: 1
          description: Required for Assign actions.
      required:
      - version
    ApprovalMethodEnum:
      enum:
      - manager_approved
      - self_approved
      type: string
      description: |-
        * `manager_approved` - Manager approved
        * `self_approved` - Self approved
    ApprovalWorkInOfficeRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        employee_email:
          type: string
          format: email
          readOnly: true
        base_location_name:
          type: string
          readOnly: true
          nullable: true
        work_date:
          type: string
          format: date
        location_choice:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LocationChoiceEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        note_present:
          type: boolean
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        approved_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        correction_deadline:
          type: string
          format: date-time
          nullable: true
      required:
      - base_location_name
      - employee_email
      - employee_name
      - id
      - note_present
      - work_date
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          type: string
          maxLength: 100
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
    AuditTimelinePage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_page:
          type: integer
          nullable: true
      required:
      - next_page
      - results
    BlankEnum:
      enum:
      - ''
    CSRFTokenResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          readOnly: true
      required:
      - email
      - id
      - memberships
    ErrorDetail:
      type: object
      properties:
        detail:
