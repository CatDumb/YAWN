name: yawn

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wio}
      POSTGRES_USER: ${POSTGRES_USER:-wio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wio-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wio} -d ${POSTGRES_DB:-wio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        DEPLOYMENT_VERSION: ${APP_VERSION:-development}
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-local-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-wio}:${POSTGRES_PASSWORD:-wio-local-only}@db:5432/${POSTGRES_DB:-wio}}
      WIO_SIGNUP_COMPANY_SLUG: ${WIO_SIGNUP_COMPANY_SLUG:-wio}
      DEPLOYMENT_VERSION: ${APP_VERSION:-development}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py shell -c "from django.conf import settings; from apps.accounts.models import Company; slug=settings.WIO_SIGNUP_COMPANY_SLUG; Company.objects.get_or_create(slug=slug, defaults={'name': slug})" &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cleanup:
    build:
      context: ./backend
      args:
        DEPLOYMENT_VERSION: ${APP_VERSION:-development}
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-local-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-wio}:${POSTGRES_PASSWORD:-wio-local-only}@db:5432/${POSTGRES_DB:-wio}}
      DEPLOYMENT_VERSION: ${APP_VERSION:-development}
    command:
      - sh
      - -c
      - >-
        while true; do if ! (python manage.py purge_expired_otps --hours 24 && python manage.py clearsessions); then echo "Cleanup failed; retrying in 24 hours." >&2; fi; sleep 86400; done
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-development}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.0}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
